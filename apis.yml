aid: kry
name: KRY
description: 'KRY is a Swedish digital healthcare provider headquartered in Stockholm that operates internationally
  under the Livi brand. It delivers primary care through video and chat consultations with doctors, nurses,
  psychologists, physiotherapists, dietitians and midwives via its iOS and Android apps, and also runs
  physical primary care centres (vardcentraler), child health clinics and midwifery clinics across Sweden.
  KRY operates as Kry in Sweden (kry.se) and Norway (kry.no) and as Livi in the United Kingdom (livi.co.uk)
  and France (livi.fr). Services span digital consultations, prescription renewal, medical certificates,
  vaccination and testing, mental health programmes, occupational health for employers, and regional public
  healthcare contracts. KRY publishes no public developer program, partner API or SDK surface; the platform
  is consumer- and clinician-facing, so this profile captures the company identity plus its legal and
  security surface rather than an API surface.'
